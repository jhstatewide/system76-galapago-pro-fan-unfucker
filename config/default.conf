# Galago Pro Fan Control Daemon Configuration
# This file contains default settings for the fan control daemon
# Users can modify these values to customize behavior

# Default target temperature (40-100°C)
# This is the temperature the daemon will try to maintain
DEFAULT_TARGET_TEMP=45

# PID Controller settings
# These control how aggressively the fan responds to temperature changes
PID_KP=2.0    # Proportional gain (higher = more aggressive response)
PID_KI=0.1    # Integral gain (higher = eliminates steady-state error)
PID_KD=0.5    # Derivative gain (higher = reduces overshoot)

# Adaptive PID settings
# The daemon can automatically tune PID parameters for optimal performance
ADAPTIVE_PID_ENABLED=1                    # Enable adaptive tuning (0=disabled, 1=enabled)
ADAPTIVE_TUNING_INTERVAL=30               # Seconds between tuning attempts (10-300)
ADAPTIVE_TARGET_PERFORMANCE=0.8           # Target performance score (0.1-1.0)

# Logging settings
LOG_LEVEL=LOG_INFO                         # LOG_DEBUG, LOG_INFO, LOG_WARNING, LOG_ERR
STATUS_INTERVAL=2.0                       # Seconds between status updates (0.1-60.0)

# Service settings
# These are set in the systemd service file but documented here for reference
# CPU_PRIORITY=19                         # Nice level (19 = lowest priority)
# RESTART_POLICY=on-failure              # Restart on failure
# RESTART_SEC=5                          # Seconds to wait before restart

# Advanced settings (not typically changed)
# EC_REG_CPU_TEMP=0x07                   # CPU temperature register
# EC_REG_GPU_TEMP=0xCD                   # GPU temperature register
# EC_REG_FAN_DUTY=0xCE                   # Fan duty cycle register
# EC_REG_FAN_RPMS_HI=0xD0                # Fan RPM high byte register
# EC_REG_FAN_RPMS_LO=0xD1                # Fan RPM low byte register 